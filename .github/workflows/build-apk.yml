name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Ignore cache and rebuild from scratch"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev \
            build-essential ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython>=3.0.10,<3.1" virtualenv "setuptools<81"

      - name: Cache buildozer
        if: ${{ !inputs.clean_build }}
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'core/version.py') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -n -i -E "error|failed|exception|traceback|fatal|not found" build.log | grep -v -i "performance hint" | tail -n 80 || true
          echo "-----"
          tail -n 120 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blacknet-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: bin/*.apk
