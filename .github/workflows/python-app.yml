name: Python Application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Syntax check (compile)
      run: |
        python -m compileall core tests blacknet.py main.py

    - name: Unit tests
      run: |
        python -m unittest discover -s tests

    - name: Smoke test (CLI)
      run: |
        python blacknet.py --version
        python blacknet.py --help
