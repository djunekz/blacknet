name: Auto Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Release tar.gz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Get tag name
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "TAG=${{ inputs.tag }}" >> $GITHUB_ENV
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Build tar.gz (exclude tools)
        run: |
          git archive \
            --format=tar \
            --prefix=blacknet-${TAG}/ \
            ${TAG} \
            ':!tools' \
            | gzip > blacknet-${TAG}.tar.gz

      - name: Generate checksum
        run: |
          sha256sum blacknet-${TAG}.tar.gz > blacknet-${TAG}.tar.gz.sha256

      - name: Create GitHub Release (auto notes)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: BlackNet ${{ env.TAG }}
          generate_release_notes: true
          files: |
            blacknet-${{ env.TAG }}.tar.gz
            blacknet-${{ env.TAG }}.tar.gz.sha256
